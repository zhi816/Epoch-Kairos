<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epoch Kairos 手機版 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&family=Newsreader:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 手機版原型 v2：資料由 wiki/ Frontmatter 產生；全黑星空，單一深色主題 */
:root{
  color-scheme:dark;
  --ink:#0B0C0E; --surface:#141517; --sunken:#101012;
  --fg:#E8E4DA; --fg-strong:#F4F1EA; --body:#D9D5CB; --soft:#B5B0A6; --muted:#9A958C; --subtle:#88837A;
  --line:rgba(232,228,218,0.12); --card-ink:#0F1013; --blue:#8FD5FD; --acc:#9BDCB1; --acc-rgb:155,220,177;
  --serif:'Noto Serif TC','Songti TC',serif; --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --latin:'Newsreader',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:1px solid var(--fg-strong);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:48px;box-sizing:border-box}
.mono{font-family:var(--mono);letter-spacing:.14em;font-size:11px;color:var(--subtle)}
.stack{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hair{height:1px;background:linear-gradient(90deg,rgba(232,228,218,.22),rgba(232,228,218,.04) 60%,rgba(232,228,218,0))}
[hidden]{display:none !important}

/* 標題與隱藏機關 */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:28px}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.motto{display:flex;align-items:center;flex-wrap:wrap;min-height:44px}
.motto .zh{font-family:var(--serif);font-size:17px;letter-spacing:.5em;color:#EAE6DF}
.secret{width:44px;height:44px;margin-left:-10px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.secret i{display:block;width:3px;height:3px;border-radius:50%;background:#FFFDF8;box-shadow:0 0 3px 1px rgba(255,255,255,.3);animation:beacon 7s ease-in-out infinite;transition:width .3s,height .3s,box-shadow .3s}
.secret[data-armed="true"] i{width:5px;height:5px;animation:none;box-shadow:0 0 0 3px var(--ink),0 0 0 4px rgba(143,213,253,.85),0 0 12px 4px rgba(143,213,253,.45)}
body[data-mode="focus"] .secret i{width:10px;height:10px;animation:none;background:radial-gradient(circle,#FFFDF8 0 1.3px,rgba(255,253,248,0) 1.8px);box-shadow:inset 0 0 0 1px var(--blue),0 0 10px 2px rgba(143,213,253,.55)}
.hint{font-size:12px;line-height:1.5;color:var(--blue)}

/* 星圖 */
.mapsec{margin-top:26px}
.mapwrap{position:relative;margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0}
.map{position:relative;width:100%;overflow:hidden;touch-action:pan-y}
.map svg.bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.nd{position:absolute;width:0;height:0}
.nd>*{position:absolute}
.flow{stroke-dasharray:4 17;animation:flow 1.7s linear infinite}
.back{min-height:36px;padding:0 0 1px;border:0;border-bottom:1px solid rgba(232,228,218,.4);background:none;font-size:12px;letter-spacing:.06em;color:var(--fg);cursor:pointer}
body[data-mode="focus"] .back{border-bottom-color:rgba(143,213,253,.5);color:var(--blue)}
.lbl{white-space:nowrap;font-size:11px;line-height:1.25;color:#EAE6DF;text-shadow:0 0 6px var(--ink),0 0 2px var(--ink);pointer-events:none;transition:opacity .25s}
.lbl.r{left:9px;top:0;transform:translateY(-50%)}
.lbl.l{right:9px;top:0;transform:translateY(-50%);text-align:right}
.lbl.sel{padding:2px 6px;border-radius:4px;background:rgba(11,12,14,.78);color:#F4F1EA;text-shadow:none}
.dot{left:0;top:0;border-radius:50%;background:#FFFDF8;transform:translate(-50%,-50%)}
.hub{left:-22px;top:-22px;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hub .halo{position:absolute;left:-6px;top:-6px;width:56px;height:56px;border-radius:50%;pointer-events:none}
.hub svg{position:relative;overflow:visible}
.hublbl{font-family:var(--serif);font-size:12px;color:#EAE6DF;white-space:nowrap;text-shadow:0 0 6px var(--ink);pointer-events:none}
.hublbl.r{left:14px}.hublbl.l{right:14px}
.star{left:-14px;top:-14px;width:28px;height:28px;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.star .ring{position:absolute;left:7px;top:7px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;animation:pulse 4.2s ease-in-out infinite}
.star .core{border-radius:50%;background:#FFFDF8;transition:width .2s,height .2s}
.map[data-zoom="none"] .star{pointer-events:none}
.cpt{left:0;top:0;width:7px;height:7px;box-sizing:border-box;border:1px solid #EAE6DF;transform:translate(-50%,-50%) rotate(45deg)}
.kairos{left:0;top:0;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 5px 2px rgba(255,255,255,.85),0 0 18px 6px rgba(244,241,234,.22)}

/* 篩選列（原懸星索引） */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px)) 4px;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid rgba(232,228,218,.16);background:rgba(11,12,14,.6);font-family:var(--serif);font-size:13px;letter-spacing:.06em;color:var(--c,#EAE6DF);cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip b{font-family:var(--latin);font-weight:400;font-size:15px;letter-spacing:0}
.chip[aria-pressed="true"]{border-color:var(--c,#F4F1EA);background:rgba(var(--rgb,232,228,218),.12)}
.chip[aria-disabled="true"]{opacity:.45}
.chip svg{overflow:visible}

/* 說明框 */
.info{margin-top:12px;display:flex;flex-direction:column;gap:7px;padding:15px 16px;border-radius:10px;border:1px solid rgba(var(--rgb,232,228,218),.3);background:rgba(11,12,14,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.info .nm{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.4;color:var(--fg-strong)}
.info .meta{font-size:12px;line-height:1.6;color:var(--muted)}
.info .foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding-top:9px;border-top:1px solid var(--line)}
.info .go{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--fg-strong)}
.info .tip{font-size:13px;line-height:1.7;color:var(--soft)}

/* 卡片牆 */
#archive{position:relative;margin-top:30px;padding-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.card{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cv{aspect-ratio:3/4;container-type:inline-size;box-sizing:border-box;padding:6cqw;display:flex;flex-direction:column;gap:3.6cqw;border-radius:2px}
.cv .top{display:flex;justify-content:space-between;gap:3cqw;font-family:var(--mono);font-size:6.6cqw;letter-spacing:.04em;white-space:nowrap}
.cv .win{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:1px}
.cv .win i{position:absolute;border-radius:50%;background:#fff}
.cv .big{position:absolute;left:6cqw;right:6cqw;bottom:5cqw;display:flex;flex-direction:column;gap:1.6cqw}
.cv .big small{font-size:6.6cqw;line-height:1.2}
.cv .yr{font-family:var(--latin);font-style:italic;font-weight:300;font-size:27cqw;line-height:.85;letter-spacing:-.03em}
.cv .lang{font-family:var(--serif);font-weight:400;line-height:1.05;letter-spacing:.02em;white-space:nowrap}
.cv .ttl{font-family:var(--serif);font-weight:600;font-size:9.6cqw;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv .bot{display:flex;justify-content:space-between;align-items:baseline;gap:3cqw;padding-top:3cqw;font-size:6.6cqw;white-space:nowrap}
.cv .bot span:first-child{overflow:hidden;text-overflow:ellipsis}
.cv.ms{color:var(--card-ink)}
.cv.ms .top,.cv.ms .bot{color:rgba(15,16,19,.78)}
.cv.ms .bot{border-top:1px solid rgba(15,16,19,.24)}
.cv.fc{background:#121519;color:#EAE6DF}
.cv.fc .bot{border-top:1px solid rgba(234,230,223,.14);color:var(--muted)}
.more{margin-top:14px;width:100%;min-height:48px;border:1px solid rgba(232,228,218,.22);border-radius:999px;background:none;color:var(--fg);font-size:14px;cursor:pointer}
footer{margin-top:36px;padding-top:18px;border-top:1px solid rgba(232,228,218,.1);display:flex;flex-direction:column;gap:6px}

/* 論文頁 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;height:52px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 8px;background:rgba(11,12,14,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,228,218,.08)}
.bar a{display:inline-flex;align-items:center;min-width:44px;min-height:44px;padding:0 8px;font-size:14px}
.bar .doi{justify-content:flex-end;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--acc)}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 4px;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.car::-webkit-scrollbar{display:none}
.pc{flex:0 0 calc(100% - 44px);max-width:360px;scroll-snap-align:start;aspect-ratio:3/4;container-type:inline-size;box-sizing:border-box;padding:6cqw;display:flex;flex-direction:column;gap:4.4cqw;border-radius:2px;border:1px solid rgba(var(--acc-rgb),.3);background:var(--surface);color:var(--fg);overflow:hidden}
.pc .lab{font-family:var(--mono);font-size:3.4cqw;letter-spacing:.14em;color:var(--acc)}
.pc .h{font-family:var(--serif);font-weight:600;font-size:7.6cqw;line-height:1.35;color:var(--fg-strong)}
.pc .s{font-size:3.6cqw;line-height:1.6;color:var(--muted)}
.pc .ft{margin-top:auto;padding-top:3cqw;border-top:1px solid var(--line);font-size:3.4cqw;color:var(--subtle)}
.pc.cover{background:var(--acc);border:0;color:var(--card-ink);padding:5.4cqw;gap:3.4cqw}
.pc.cover.fc{background:#121519;color:#EAE6DF;border:1px solid rgba(var(--acc-rgb),.3)}
.pc .hook{font-size:4.2cqw;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vs{display:grid;grid-template-columns:auto 1fr 1fr;gap:2.6cqw 3cqw;align-items:center}
.vs .hd{font-size:3.4cqw;color:var(--subtle);text-align:center}
.vs .nm{font-size:4.2cqw;color:#EAE6DF;white-space:nowrap}
.vs .cell{display:flex;flex-direction:column;align-items:center;gap:.8cqw;padding:2.4cqw 1cqw;border-radius:1cqw;background:rgba(232,228,218,.04)}
.vs .cell b{font-family:var(--serif);font-weight:600;font-size:8cqw;line-height:1}
.vs .cell span{font-size:3.2cqw;color:var(--muted);text-align:center}
.vs .ok b{color:var(--acc)} .vs .no b{color:#6F6B64}
.chipx{padding:2.4cqw 3cqw;border-radius:1cqw;font-size:3.8cqw;line-height:1.55}
.bign{display:flex;flex-direction:column;gap:1.6cqw;padding-top:3cqw;border-top:1px solid rgba(var(--acc-rgb),.35)}
.bign b{font-family:var(--latin);font-weight:300;font-size:12cqw;line-height:1;color:var(--acc)}
.bign span{font-size:3.6cqw;line-height:1.5;color:var(--soft)}
.tl{display:grid;grid-template-columns:12cqw minmax(0,1fr);gap:2cqw;font-size:3.8cqw;line-height:1.45;color:#EAE6DF}
.tl b{font-family:var(--latin);font-weight:400;font-size:4.6cqw;color:var(--acc)}
.dots{display:flex;justify-content:space-between;align-items:center;padding:4px 0 0}
.dots .btns{display:flex;margin-right:-8px}
.dots button{width:28px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dots button i{height:6px;width:6px;border-radius:3px;background:rgba(232,228,218,.28);transition:width .2s}
.dots button[aria-current="true"] i{width:18px;background:var(--acc)}
article{display:flex;flex-direction:column;gap:22px;padding-top:26px;font-size:16px;line-height:1.85;color:var(--body)}
article p,article ul,article ol{margin:0}
article h1{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.4;color:var(--fg-strong);text-wrap:balance}
article h2{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.5;color:var(--fg-strong)}
article h2 small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--acc)}
article h3{margin:6px 0 0;font-size:15px;font-weight:500;color:#EAE6DF}
article ul,article ol{padding-left:20px;display:flex;flex-direction:column;gap:6px}
dl{margin:0;display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px 12px;padding:14px 0;border-block:1px solid var(--line);font-size:13px;line-height:1.6}
dt{color:var(--subtle)} dd{margin:0}
aside{padding:14px 16px;border-radius:8px;background:rgba(232,228,218,.04);font-size:14px;line-height:1.75;color:var(--soft)}
.mathbox{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;border-radius:6px;background:var(--sunken);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.22),0 0 24px rgba(var(--acc-rgb),.10)}
.eq{font-family:var(--latin);font-size:17px;color:var(--fg-strong);white-space:nowrap}
.eq i{font-style:italic}
.eq sub{font-size:.66em;font-style:normal;vertical-align:-.35em;line-height:0}
.eq sup{font-size:.66em;line-height:0}
.al{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:10px;width:max-content;align-items:center}
.al>:nth-child(odd){text-align:right}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 2px 1px}
.fr>span:last-child{padding:1px 2px 0}
.refs a{display:block;padding:8px 0;font-size:13px;color:var(--acc)}

body[data-route="home"] #paper,body[data-route="paper"] #home{display:none}
@keyframes beacon{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.18);opacity:.9}}
@keyframes flow{to{stroke-dashoffset:-42}}
@media (prefers-reduced-motion:reduce){.secret i,.star .ring,.flow{animation:none}}
</style>
</head>
<body data-route="home" data-mode="stars">
<canvas id="sky" aria-hidden="true"></canvas>

<div class="page" id="home">
  <header class="hero">
    <span class="mono" id="tagline" style="font-size:10px;letter-spacing:.22em">THE KAIROS OF HUMAN THOUGHT</span>
    <h1 style="margin:0"><svg viewBox="0 0 358 66" role="img" aria-label="Epoch Kairos"><defs><linearGradient id="tf" x1="0" x2="358" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop id="tf0" offset="0" stop-color="rgba(234,230,223,0.6)"/><stop offset="0.7" stop-color="#EAE6DF"/></linearGradient></defs><text x="0" y="54" textLength="356" lengthAdjust="spacing" fill="url(#tf)" style="font-family:Newsreader,Georgia,serif;font-weight:300;font-size:66px">Epoch Kairos</text></svg></h1>
    <div class="motto"><span class="zh">人類群星閃耀時</span><button type="button" class="secret" id="secret" data-armed="false" aria-label="我的星系"><i></i></button><span class="hint" id="hint" hidden></span></div>
  </header>

  <section class="mapsec" aria-label="知識星圖">
    <div class="row" style="min-height:36px"><span class="mono" id="maplabel" style="letter-spacing:.12em">CONSTELLATION ｜ 知識星圖</span><button type="button" class="back" id="back" hidden>← 全圖</button></div>
    <div class="mapwrap"><div class="hair" style="position:absolute;left:16px;right:16px;top:0"></div><div class="map" id="map"></div></div>
    <div class="chips" id="chips" role="group" aria-label="篩選"></div>
    <div class="info" id="info" aria-live="polite"></div>
  </section>

  <section id="archive" aria-label="檔案">
    <div class="hair" style="position:absolute;left:0;right:0;top:0"></div>
    <div class="row" style="align-items:baseline"><span class="mono" id="archlabel" style="letter-spacing:.12em">ARCHIVE ｜ 群星檔案</span><span id="archinfo" style="font-size:12px;color:var(--subtle)"></span></div>
    <div class="grid" id="grid"></div>
    <button type="button" class="more" id="more" hidden></button>
  </section>

  <footer><span style="font-family:var(--latin);font-weight:300;font-size:22px;color:#EAE6DF">Epoch Kairos</span><span style="font-size:12px;color:var(--subtle)">內容由 wiki/ 編譯・原文一律連至 DOI</span></footer>
</div>

<div class="page" id="paper"></div>

<template id="tpl-opto">
  <div class="car" aria-label="六張知識圖卡，可左右滑動">
    <section class="pc cover" aria-label="第 1 張 時代銘文">
      <span style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:3.4cqw;letter-spacing:.1em;color:rgba(15,16,19,.75)"><span>EPOCH KAIROS</span><span>No.{{NO}}</span></span>
      <span class="cwin" style="position:relative;flex:1;min-height:0;overflow:hidden;border-radius:1px;background:#1E2A24">
        <span style="position:absolute;left:74%;top:26%;width:2.6cqw;height:2.6cqw;transform:translate(-50%,-50%);border-radius:50%;background:#FFFDF8;box-shadow:0 0 0 1.4cqw #1E2A24,0 0 0 1.9cqw rgba(244,241,234,.55),0 0 5cqw 1cqw rgba(244,241,234,.35)"></span>
        <span style="position:absolute;left:5cqw;bottom:4cqw;display:flex;flex-direction:column;gap:1cqw;color:var(--acc)"><span style="font-size:3.6cqw">發表</span><span style="font-family:var(--latin);font-style:italic;font-weight:300;font-size:26cqw;line-height:.85;letter-spacing:-.03em">2005</span></span>
      </span>
      <span style="font-size:3.8cqw;color:rgba(15,16,19,.75)">生醫與生命科技・#神經科學 #生物科技</span>
      <span style="font-family:var(--serif);font-weight:600;font-size:9cqw;line-height:1.2">光遺傳學</span>
      <span style="font-size:4.3cqw;line-height:1.6">讓科學家能用一道藍光，在千分之一秒內開關大腦中某一類特定的神經元。</span>
      <span style="padding-top:2.6cqw;border-top:1px solid rgba(15,16,19,.22);font-size:3.6cqw;color:rgba(15,16,19,.75)">2005 發表 ｜ 2026 諾貝爾獎</span>
    </section>

    <section class="pc" aria-label="第 2 張 世紀瓶頸" style="gap:5cqw">
      <span class="lab">02 ｜ 世紀瓶頸</span>
      <span class="h">快的不準，準的不快</span>
      <span class="vs" role="table" aria-label="電極刺激與化學藥物的比較">

        <span role="row" style="display:contents"><span class="nm" role="rowheader">化學藥物</span><span class="cell no" role="cell"><b>慢</b><span>數秒至數十分鐘</span></span><span class="cell ok" role="cell"><b>準</b><span>鎖定特定受體</span></span></span>
      </span>
      <span class="s">大腦以毫秒為單位運作。電刺激跟得上速度卻無法挑對象，藥物挑得準卻慢了好幾個數量級。</span>
      <span class="ft" style="font-size:4cqw;color:#EAE6DF">缺的是一個又快又準的開關。</span>

    <header class="stack" style="gap:10px">
      <span class="mono" style="color:var(--acc)">2005 發表 ｜ 2026 諾貝爾生理學或醫學獎</span>
      <h1>光遺傳學：以光精準控制大腦神經元</h1>
      <span style="font-family:var(--latin);font-style:italic;font-size:16px;line-height:1.5;color:var(--soft)">Millisecond-timescale, genetically targeted optical control of neural activity</span>
    </header>
    <dl>
      <dt>作者</dt><dd>Boyden, Zhang, Bamberg, Nagel, Deisseroth</dd>
      <dt>得獎者</dt><dd>Deisseroth, Hegemann, Nagel</dd>
      <dt>期刊</dt><dd>Nature Neuroscience, 8(9), 1263-1268</dd>
      <dt>標籤</dt><dd>#神經科學 #生物科技</dd>
    </dl>
    <aside>本頁範圍：2026 年獎項表彰一系列工作。本頁以 Boyden 等 (2005) 為主軸；Nagel 與 Hegemann 2002、2003 年的奠基論文列於文末。Hegemann 並非 2005 年該篇的作者。</aside>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 1 ｜ THE HOOK</small>時代銘文</h2>
      <p>在 2005 年以前，神經科學能「看見」大腦活動，卻無法「指定」某一類神經元在某一毫秒放電。這篇論文讓單一類型的神經元變成一個可以用光開關的電路元件，把大腦研究從觀察相關性，推進到操控因果。</p>
    </section>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 2 ｜ THE DILEMMA</small>世紀瓶頸</h2>
      <p>探索意識、情感與腦部疾病的迴路時，神經科學長期受困於時間與空間精度無法兼得：</p>
      <ul>
        <li><b style="color:#EAE6DF;font-weight:500">電刺激快而不準</b>：微電極刺激可達毫秒級，但電流在腦組織中擴散，會同時激活周圍的興奮性、抑制性神經元與過路軸突，因果關係無從拆解。</li>
        <li><b style="color:#EAE6DF;font-weight:500">藥物準而不快</b>：藥理學可經由專一受體作用於特定神經元，但擴散與代謝需數秒至數十分鐘，追不上以毫秒進行的神經電訊號。</li>
      </ul>
    </section>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 3 ｜ THE SECRET</small>突破架構與原理</h2>
      <p>源自綠藻 <i>Chlamydomonas reinhardtii</i> 的 ChR2，兼具感光色素與離子通道兩種功能。藍光（約 470 nm）照射時通道打開，陽離子（Na<sup>+</sup>、Ca<sup>2+</sup>、H<sup>+</sup>）內流，細胞去極化並誘發動作電位。</p>
      <h3>光敏感通道之光電流方程</h3>
      <div class="mathbox" role="math" aria-label="I ChR2 等於 g ChR2 乘 O(t) 乘 G(Vm) 乘 (Vm 減 E ChR2)"><span class="eq"><i>I</i><sub>ChR2</sub>(<i>t</i>, <i>V</i><sub><i>m</i></sub>) = <i>g</i><sub>ChR2</sub> · <i>O</i>(<i>t</i>) · <i>G</i>(<i>V</i><sub><i>m</i></sub>) · (<i>V</i><sub><i>m</i></sub> − <i>E</i><sub>ChR2</sub>)</span></div>
      <span style="align-self:flex-end;margin-top:-6px;font-size:11px;color:var(--subtle)">公式過長時可左右滑動</span>
      <h3>三態光循環動力學</h3>
      <div class="mathbox" role="math" aria-label="關閉態、開放態、去敏化態三個微分方程，三者總和為一"><span class="eq al">
        <span><span class="fr"><span><i>dC</i></span><span><i>dt</i></span></span></span><span>= <i>k<sub>r</sub></i> <i>D</i> − <i>k<sub>a</sub></i>(<i>I</i>) <i>C</i></span>
        <span><span class="fr"><span><i>dO</i></span><span><i>dt</i></span></span></span><span>= <i>k<sub>a</sub></i>(<i>I</i>) <i>C</i> − <i>k<sub>d</sub></i> <i>O</i></span>
        <span><span class="fr"><span><i>dD</i></span><span><i>dt</i></span></span></span><span>= <i>k<sub>d</sub></i> <i>O</i> − <i>k<sub>r</sub></i> <i>D</i></span>
        <span><i>C</i> + <i>O</i> + <i>D</i></span><span>= 1</span>
      </span></div>
      <h3>膜電位整合方程（aligned 斷行）</h3>
      <div class="mathbox" role="math" aria-label="Hodgkin-Huxley 膜電位方程加入光電流項"><span class="eq al">
        <span><i>C<sub>m</sub></i> <span class="fr"><span><i>dV<sub>m</sub></i></span><span><i>dt</i></span></span> =</span><span>− <i>ḡ</i><sub>Na</sub> <i>m</i><sup>3</sup><i>h</i> (<i>V<sub>m</sub></i> − <i>E</i><sub>Na</sub>)</span>
        <span></span><span>− <i>ḡ</i><sub>K</sub> <i>n</i><sup>4</sup> (<i>V<sub>m</sub></i> − <i>E</i><sub>K</sub>)</span>
        <span></span><span>− <i>g<sub>L</sub></i> (<i>V<sub>m</sub></i> − <i>E<sub>L</sub></i>)</span>
        <span></span><span>− <i>I</i><sub>ChR2</sub>(<i>t</i>, <i>V<sub>m</sub></i>) + <i>I</i><sub>ext</sub></span>
      </span></div>
      <p>藍光脈衝入射時，<span class="eq" style="font-size:16px"><i>I</i><sub>ChR2</sub></span> 快速提供去極化內向電流，使膜電位在毫秒內越過激發閾值，觸發單一動作電位。</p>
    </section>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 4 ｜ THE EVIDENCE</small>決定性數據</h2>
      <h3 style="margin:0">本篇論文（Boyden 等 2005）</h3>
      <ul>
        <li>藍光照射後，ChR2 光電流於亞毫秒尺度啟動。</li>
        <li>短促藍光脈衝可穩定誘發單一動作電位，放電抖動落在毫秒量級。</li>
        <li>神經元能在數 Hz 至數十 Hz 範圍內逐次跟隨脈衝序列。</li>
        <li>哺乳動物神經元內源視黃醛即足以支持 ChR2 作用。</li>
      </ul>
      <h3>後續他人成果（非本篇）</h3>
      <ul style="font-size:14px;color:var(--soft)">
        <li>Aravanis 等 (2007), J Neural Eng：植入光纖於清醒小鼠活體光控</li>
        <li>Adamantidis 等 (2007), Nature：光控下視丘神經元與睡眠甦醒</li>
        <li>Gradinaru 等 (2009), Science：解構帕金森氏症迴路</li>
        <li>Tye 等 (2011), Nature：杏仁核投射雙向調控焦慮</li>
        <li>Liu 等 (2012), Nature；Ramirez 等 (2013), Science：記憶印痕操控</li>
      </ul>
    </section>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 5 ｜ THE REVOLUTION</small>時代典範轉移</h2>
      <ul>
        <li><b style="color:#EAE6DF;font-weight:500">連接圖譜功能化</b>：解剖學過去只能畫出靜態結構，光遺傳學讓全腦動態因果圖譜的測繪成為可能。</li>
        <li><b style="color:#EAE6DF;font-weight:500">神經與精神疾病</b>：鎖定丘腦底核與基底核的失調迴路，修正了深腦刺激療效機制的既有理解；解析多巴胺獎勵迴路，為憂鬱症與成癮的靶向治療提供理論依據；MIT 利根川進實驗室實現記憶標記、恐懼記憶召回與偽記憶植入。</li>
        <li><b style="color:#EAE6DF;font-weight:500">臨床轉譯</b>：光遺傳學原理已進入視網膜疾病的臨床研究階段。</li>
      </ul>
    </section>

    <section class="stack" style="gap:12px">
      <h2><small>CARD 6 ｜ THE KAIROS</small>跨界思維與啟發</h2>
      <p>光遺傳學的震撼，不在憑空創造新元件，而在把單細胞綠藻演化十億年的趨光分子開關，嫁接進哺乳動物大腦的神經元。</p>
      <ol>
        <li><b style="color:#EAE6DF;font-weight:500">跨學科的降維打擊</b>：困擾神經科學近百年的時空精度難題，解答不在神經科學內部，而在微生物學的冷門角落。</li>
        <li><b style="color:#EAE6DF;font-weight:500">因果的工程化閉環</b>：科學認知從觀察現象的相關性，升級為精確操控的因果判定。</li>
      </ol>
    </section>

    '<aside>這篇的長文與其餘卡片尚未編譯成網頁。原型先以 Wiki Frontmatter 產生封面卡與基本資料。</aside>' +
    (p.doi ? '<section class="stack refs" style="gap:2px;padding-top:18px;border-top:1px solid var(--line)"><span class="mono">SOURCE</span><a href="' + esc(p.doi) + '">' + esc(p.doi.replace('https://', '')) + '</a></section>' : '') + '</article>'; }
function showPaper(slug){ var isF = !!byF[slug], p = byF[slug] || byP[slug], el = $('paper'); if (!p){ location.hash = '#'; return; }
  var d = D.dom[p.d], rgb = isF ? fRgb(p) : d.rgb, col = isF ? fColor(p) : d.color;
  el.style.setProperty('--acc', col); el.style.setProperty('--acc-rgb', rgb);
  document.body.dataset.route = 'paper';
  var bar = '<div class="bar"><a href="' + (isF ? '#my-constellation' : '#') + '">← ' + (isF ? '我的星系' : '群星') + '</a><span class="mono">' + (isF ? 'F.' + pad2(p.no) + ' ｜ ' + esc(roleName[p.role]) : 'No.' + pad2(p.no) + ' ｜ ' + esc(d.name)) + '</span>' + (p.doi ? '<a class="doi" href="' + esc(p.doi) + '">DOI</a>' : '<span style="min-width:44px"></span>') + '</div>';
  if (slug === '2005-optogenetics'){ el.innerHTML = bar + $('tpl-opto').innerHTML.replace('{{NO}}', pad2(p.no)); initCarousel(el, CARDNAMES); }
  else { el.innerHTML = bar + genericPaper(p, isF); initCarousel(el, ['時代銘文', '尚待編譯']); }
  window.scrollTo(0, 0); }

/* ---------- 路由 ---------- */
function route(){ var h = location.hash;
  if (h.indexOf('#paper/') === 0){ if (document.body.dataset.route === 'home') S.homeScroll = window.scrollY; showPaper(decodeURIComponent(h.slice(7))); return; }
  var wasPaper = document.body.dataset.route === 'paper'; document.body.dataset.route = 'home';
  var m = h === '#my-constellation' ? 'focus' : 'stars';
  if (m !== S.mode || !map.childElementCount) applyMode(m); else refresh();
  if (S.mode === 'stars' && S.zoom){ animateTo(domainView(S.zoom)); }
  if (wasPaper) window.scrollTo(0, S.homeScroll); }
addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
