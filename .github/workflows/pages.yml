# 將 web/ 發布至 GitHub Pages（見 wiki/todo.md TD-005）。
# 只上傳 web/ 之內容，wiki/、raw/、AGENTS.md 等不上站；web/prototypes/（樣稿與手機原型，非正式頁面）亦排除。
# 倉庫 Settings -> Pages 之 Source 須設為「GitHub Actions」。
name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次發布；進行中之發布不取消，以免站點停在半途。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble site from web/ (without prototypes/)
        run: |
          rsync -a --exclude '/prototypes/' web/ _site/
          test -f _site/index.html

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
