<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}｜Epoch Kairos</title>
<!-- 由 tools/build_paper_prototype.py 自 wiki/cards/ 與 wiki/papers/ 產生，請勿手改。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&family=Newsreader:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --bg:#0B0C0E;--fg:#E8E4DA;--fg-strong:#F4F1EA;--body:#D9D5CB;--muted:#B5B0A6;--subtle:#9A958C;--label:#88837A;
  --hair:rgba(232,228,218,.08);--ink:#0F1013;--ink2:rgba(15,16,19,.74);--ink-line:rgba(15,16,19,.22);
  --serif-zh:'Noto Serif TC',serif;--sans:'Noto Sans TC','Microsoft JhengHei',sans-serif;--serif:'Newsreader',serif;
  --mono:'JetBrains Mono',monospace;--display:'Playfair Display',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans)}
a{color:var(--star);text-decoration:none}a:hover{text-decoration:underline}
button,a,section{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--fg-strong);outline-offset:3px}
button:disabled{cursor:default;opacity:.3}

/* ---------------- 版面：窄導軌｜卡片欄｜長文｜資訊欄（DESIGN.md 第五章第 1 節） */
.root{height:100vh;min-height:680px;display:grid;grid-template-columns:64px minmax(440px,37%) minmax(0,1fr) 272px;overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 24px;border-right:1px solid var(--hair);min-height:0}
.rail a.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg)}
.rail .title{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:24px;letter-spacing:.06em;color:#EAE6DF}
.rail .motto{writing-mode:vertical-rl;font-family:var(--serif-zh);font-size:12px;letter-spacing:.3em;color:var(--subtle)}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 0;border-right:1px solid var(--hair);container-type:size}
.deck{display:grid;grid-template-rows:minmax(0,1fr);width:min(calc(100cqw - 56px),calc((100cqh - 76px) * .75));aspect-ratio:3/4}
.ctrl{display:flex;align-items:center;gap:2px}
.ctrl .arrow{width:44px;height:44px;border:0;background:transparent;color:#EAE6DF;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl .dots{display:flex;align-items:center}
.ctrl .dot{width:24px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl .dot span{width:6px;height:6px;border-radius:3px;background:rgba(232,228,218,.3);transition:width .25s ease,background .25s ease}
.ctrl .dot[aria-current="true"] span{width:20px;background:var(--star)}
.ctrl .label{margin-left:12px;min-width:132px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.pane{position:relative;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(232,228,218,.16) transparent}
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:26px;padding:36px 26px 40px;border-left:1px solid var(--hair);font-size:13.5px;line-height:1.7;color:var(--body)}

/* ---------------- 卡片（3:4，cqw 縮放；外層為尺寸容器，內距在內層，DESIGN.md 第二章第 5 節） */
.card{grid-area:1/1;display:block;min-height:0;container-type:inline-size;border-radius:2px;overflow:hidden;opacity:0;transform:translateX(3%) scale(.985);pointer-events:none;transition:opacity .4s ease,transform .4s ease;background:var(--star);color:var(--ink)}
.card.before{transform:translateX(-3%) scale(.985)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.in{display:flex;flex-direction:column;width:100%;height:100%;padding:6cqw;gap:4cqw}
.kc{font-family:var(--mono);font-size:3.6cqw;letter-spacing:.14em;color:var(--deep)}
.hd{font-family:var(--serif-zh);font-weight:600;font-size:7.4cqw;line-height:1.35;color:var(--ink)}
.ft{padding-top:3cqw;border-top:1px solid var(--ink-line);font-size:3.6cqw;line-height:1.6;color:var(--ink2)}
.tx{font-size:3.6cqw;line-height:1.6}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3cqw}
.row{display:grid;grid-template-columns:20cqw minmax(0,1fr);gap:3cqw;padding:3.2cqw;border-radius:1cqw;background:rgba(15,16,19,.07)}
.row b{font-size:3.8cqw;font-weight:500;color:var(--ink)}
.row span{font-size:3.6cqw;line-height:1.6;color:var(--ink2)}
.row.gap{background:rgba(255,255,255,.22);border:1px dashed color-mix(in srgb,var(--deep) 60%,transparent)}
.row.gap b{color:var(--deep)}.row.gap span{color:var(--deep)}
.fbox{overflow-x:auto;padding:4.4cqw 3cqw;border-radius:1cqw;background:#16151C;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--star) 40%,transparent);text-align:center;color:#F4F1EA;font-size:4.2cqw}
.fbox .katex-display{margin:0}
.stats{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4cqw}
.stats.two{grid-template-columns:1fr;align-content:center}
.stat{display:flex;flex-direction:column;gap:1.6cqw;padding-top:3cqw;border-top:1px solid rgba(15,16,19,.35)}
.stat .v{font-family:var(--serif);font-weight:300;font-size:12cqw;line-height:1;color:var(--deep)}
.stat .l{font-size:3.6cqw;line-height:1.55;color:var(--ink2)}
.concl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3.4cqw}
.concl p{margin:0;padding-top:3cqw;border-top:1px solid rgba(15,16,19,.35);font-family:var(--serif-zh);font-weight:600;font-size:5cqw;line-height:1.5}
.time{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding-left:4cqw;border-left:1px solid color-mix(in srgb,var(--deep) 60%,transparent)}
.time p{margin:0;display:grid;grid-template-columns:12cqw minmax(0,1fr);gap:2cqw;font-size:3.7cqw;line-height:1.5}
.time p b{font-family:var(--serif);font-weight:400;font-size:4.6cqw;color:var(--deep)}
.quote{margin-top:auto;font-family:var(--serif-zh);font-weight:600;font-size:6.8cqw;line-height:1.65}
.shift{display:flex;align-items:center;gap:3cqw;font-size:4cqw;color:var(--ink2)}
.shift i{flex:1;height:1px;background:var(--deep)}
.shift b{font-weight:500;color:var(--deep)}

/* 示意圖：顏色只用 class，由卡組套色（paper-card-writer references/diagram.md 第五節） */
.dia{display:block;width:100%;height:auto;overflow:visible}
.dia path,.dia line,.dia polyline{fill:none!important}
.dia *{stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dia .k-line{stroke:var(--deep);fill:none;stroke-width:1.7}
.dia .k-accent{stroke:var(--deep);fill:var(--deep)}
.dia .k-ink{stroke:var(--ink);fill:var(--ink)}
.dia .k-muted{stroke:rgba(15,16,19,.55);fill:rgba(15,16,19,.55)}
.dia .k-soft{stroke:none;fill:color-mix(in srgb,var(--deep) 18%,transparent)}
.dia .k-ring{fill:none!important}
.dia .k-dash{stroke-dasharray:3 3}
.dia .k-thin{stroke-width:.9}
.dia text{stroke:none;font-family:var(--sans);font-size:11px}
.dia .k-label{fill:rgba(15,16,19,.75)}
.dia .k-label-accent{fill:var(--deep)}

/* 封面（F 版型，DESIGN.md 第二章第 3 節） */
.cover .in{gap:3.4cqw}
.cover .ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:3.6cqw;letter-spacing:.1em;color:var(--ink2)}
.cover .ph span+span{font-family:var(--sans);letter-spacing:.12em}
.cover .win{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:1px;background:var(--win)}
.cover .win i{position:absolute;border-radius:50%;background:#fff}
.cover .rep{position:absolute;left:76%;top:24%;width:2.6cqw;height:2.6cqw;transform:translate(-50%,-50%);border-radius:50%;background:#FFFDF8;box-shadow:0 0 2.4cqw .4cqw rgba(244,241,234,.45)}
.cover .rep.award{box-shadow:0 0 0 1.4cqw var(--win),0 0 0 1.9cqw rgba(244,241,234,.55),0 0 5cqw 1cqw rgba(244,241,234,.35)}
.cover .line{position:absolute;left:5.4cqw;right:5.4cqw;bottom:5cqw;display:flex;flex-direction:column;font-family:var(--serif-zh);font-weight:600;font-size:8cqw;line-height:1.4;letter-spacing:.02em;color:var(--star)}
.cover .tags{font-size:3.5cqw;line-height:1.5;color:var(--ink2)}
.cover .name{font-family:var(--serif-zh);font-weight:600;font-size:7cqw;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover .lead{font-size:3.7cqw;line-height:1.65;color:rgba(15,16,19,.82)}
.cover .yrs{padding-top:2.6cqw;border-top:1px solid var(--ink-line);font-size:3.6cqw;color:rgba(15,16,19,.75)}
/* 我的關注封面：深色卡＋藍框（human 用玫瑰粉），代表星為空心星 */
.cover.focus{background:#121519;color:#EAE6DF;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--focus) 28%,transparent)}
.cover.focus .ph,.cover.focus .tags,.cover.focus .yrs{color:var(--subtle)}
.cover.focus .win{background:#0C0E11}
.cover.focus .line{color:var(--focus)}
.cover.focus .name{color:var(--fg-strong)}
.cover.focus .lead{color:var(--body)}
.cover.focus .yrs{border-top-color:rgba(234,230,223,.14)}
.cover.focus .rep{left:80%;top:22%;width:3cqw;height:3cqw;background:radial-gradient(circle,#FFFDF8 0 .6cqw,rgba(255,253,248,0) .9cqw);box-shadow:inset 0 0 0 .4cqw var(--focus),0 0 3cqw .6cqw color-mix(in srgb,var(--focus) 40%,transparent)}
.cover .lang{position:absolute;left:4.4cqw;top:4.4cqw;max-width:58cqw;box-sizing:border-box;padding:.8cqw 2.6cqw;border-radius:999px;border:1px solid color-mix(in srgb,var(--focus) 60%,transparent);background:rgba(12,14,17,.85);font-size:3.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--focus)}
/* 研究語言標籤固定一行，過長以省略號截斷，不得壓到代表星；完整語言列於資訊欄（與卡片牆一致，wiki/todo.md TD-012，2026-11-10 使用者確認） */

/* ---------------- 長文（KaTeX；區塊公式不加框，DESIGN.md 第五章第 3 節） */
.art{max-width:660px;margin:0 auto;padding:60px 52px 380px;display:flex;flex-direction:column;gap:64px;font-size:16.5px;line-height:1.9;color:var(--body)}
.art header{display:flex;flex-direction:column;gap:20px}
.art .mode{display:none;align-self:flex-start;gap:2px;padding:3px;border:1px solid rgba(232,228,218,.16);border-radius:999px}
.art .mode button{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-family:var(--sans);font-size:14px;color:var(--muted);cursor:pointer}
.art .mode button[aria-pressed="true"]{background:rgba(232,228,218,.12);color:var(--fg-strong)}
.art .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--star)}
.art h1{margin:0;font-family:var(--serif-zh);font-weight:600;font-size:32px;line-height:1.42;letter-spacing:.02em;color:var(--fg-strong)}
.art .en{margin:0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--muted)}
.art section{display:flex;flex-direction:column;gap:18px}
.art .sh{display:flex;align-items:baseline;gap:16px}
.art .num{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1;color:#4A4744;transition:color .3s ease}
.art section.cur .num{color:var(--star)}
.art h2{margin:0;font-family:var(--serif-zh);font-weight:600;font-size:24px;line-height:1.45;color:var(--fg-strong)}
.art h3{margin:10px 0 0;font-size:16px;font-weight:500;line-height:1.6;color:#EAE6DF}
.art p{margin:0}
.art ul,.art ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.art li>ul,.art li>ol{margin-top:8px}
.art strong{font-weight:500;color:#EAE6DF}
.art code{font-family:var(--mono);font-size:.86em;color:#EAE6DF;background:rgba(232,228,218,.06);padding:1px 5px;border-radius:3px}
.art pre{margin:0;overflow-x:auto;padding:14px 16px;border-radius:6px;background:rgba(232,228,218,.04);font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--muted)}
.art blockquote{margin:0;padding:14px 18px;border-radius:6px;background:rgba(232,228,218,.04);font-size:14.5px;line-height:1.8;color:var(--muted)}
/* 01 時代銘文之第一段：論文頁開頭引言（樣稿「論文頁 F」） */
.art .epigraph{margin:0;font-family:var(--serif-zh);font-size:19px;line-height:1.8;color:#EAE6DF}
.art .epigraph .src{display:block;margin-top:6px;font-family:var(--sans);font-size:12.5px;color:var(--subtle)}
.art table{border-collapse:collapse;font-size:14px;line-height:1.6;display:block;overflow-x:auto}
.art th,.art td{padding:6px 10px;border-bottom:1px solid var(--hair);text-align:left;white-space:nowrap}
.art th{color:var(--label);font-weight:500}
.m-disp{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0;text-align:center;color:var(--fg-strong)}
.m-disp .katex-display{margin:0}
.art .katex{font-size:1.06em}

/* ---------------- 資訊欄 */
.side .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--label)}
.side .blk{display:flex;flex-direction:column;gap:6px}
.side .yr{display:flex;align-items:baseline;gap:12px}
.side .yr b{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1;color:var(--fg-strong)}
.side .yr.award b{color:var(--star)}
.side .yr span{color:var(--muted)}
.side .note{font-size:12.5px;color:var(--subtle)}
.side .note code{font-family:var(--mono);font-size:.92em}
.side .chips{display:flex;flex-wrap:wrap;gap:6px}
.side .chip{padding:2px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--star) 45%,transparent);color:var(--star);font-size:12.5px}
.side .con{display:flex;align-items:center;gap:10px;min-height:30px;color:var(--body)}

/* ---------------- 窄螢幕：上下疊放（手機版以手機原型為準） */
@media (max-width:1100px){.root{grid-template-columns:64px minmax(400px,44%) minmax(0,1fr)}.side{display:none}}
@media (max-width:900px){
  .root{display:block;height:auto;overflow:visible}
  .rail{display:none}
  .stage{container-type:normal;padding:24px 16px;border-right:0}
  /* 手機：卡片並排，手指左右滑動，每次停在一張（CSS Scroll-Snap，AGENTS.md 第七章第 3 節） */
  .deck{display:flex;width:min(100%,420px);aspect-ratio:auto;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}
  .card,.card.before{flex:0 0 100%;aspect-ratio:3/4;scroll-snap-align:center;scroll-snap-stop:always;opacity:1;transform:none;pointer-events:auto;transition:none}
  /* 長文顯示方式：隨卡片時只顯示目前卡片之段落；全文時全部顯示，與卡片互不連動 */
  .art .mode{display:inline-flex}
  .art.solo section[data-card]:not(.cur){display:none}
  .pane{overflow:visible}
  .art{padding:32px 16px 64px}
  .side{display:flex;border-left:0;border-top:1px solid var(--hair)}
}
/* 手機寬度：箭頭、圓點與標籤一行約 382px，超出 375px 螢幕之可用寬度，標籤改至下一行置中 */
@media (max-width:480px){
  .ctrl{flex-wrap:wrap;justify-content:center}
  .ctrl .label{flex-basis:100%;margin:0;min-width:0;text-align:center}
}
@media (prefers-reduced-motion:reduce){.card,.art .num,.ctrl .dot span{transition:none}}
</style>
</head>
<body style="{{VARS}}">
<div class="root">
  <nav class="rail" aria-label="網站">
    <a class="back" href="{{BACK}}" aria-label="{{BACK_LABEL}}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
    <span class="title" aria-hidden="true">Epoch Kairos</span>
    <span class="motto" aria-hidden="true">人類群星閃耀時</span>
  </nav>

  <section class="stage" id="stage" tabindex="0" aria-roledescription="輪播" aria-label="知識圖卡，共六張，可用左右方向鍵切換">
    <div class="deck">
{{CARDS}}
    </div>
    <div class="ctrl">
      <button type="button" class="arrow" id="prev" aria-label="上一張卡片"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <nav class="dots" id="dots" aria-label="選擇卡片"></nav>
      <button type="button" class="arrow" id="next" aria-label="下一張卡片"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <span class="label" id="label" aria-live="polite"></span>
    </div>
  </section>

  <main class="pane" id="pane" aria-label="論文長文">
    <article class="art">
{{ARTICLE}}
    </article>
  </main>

  <aside class="side" aria-label="論文資訊">
{{SIDE}}
  </aside>
</div>
<script>
(function () {
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var secs = Array.prototype.slice.call(document.querySelectorAll('.art section[data-card]'));
  var pane = document.getElementById('pane'), stage = document.getElementById('stage');
  var dots = document.getElementById('dots'), label = document.getElementById('label');
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mq = window.matchMedia('(max-width: 900px)');          // 與 CSS 上下疊放之斷點相同
  var art = document.querySelector('.art'), deck = document.querySelector('.deck');
  var mCard = document.getElementById('m-card'), mFull = document.getElementById('m-full');
  var cur = -1, lock = 0, deckLock = 0, full = false;
  function mobile() { return mq.matches; }
  // 手機「隨卡片」：長文只顯示目前卡片之段落；「全文」與桌面：全部顯示
  function layout() { art.classList.toggle('solo', mobile() && !full); }
  function deckLeft(i) { return cards[i].offsetLeft - cards[0].offsetLeft; }
  cards.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'dot';
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 張：' + c.dataset.name);
    b.appendChild(document.createElement('span'));
    b.addEventListener('click', function () { go(i, true); });
    dots.appendChild(b);
  });
  function show(i) {
    if (i === cur) return;
    cur = i;
    cards.forEach(function (c, k) {
      c.classList.toggle('on', k === i);
      c.classList.toggle('before', k < i);
      c.setAttribute('aria-hidden', k === i ? 'false' : 'true');
    });
    Array.prototype.forEach.call(dots.children, function (d, k) { d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    secs.forEach(function (s, k) { s.classList.toggle('cur', k === i); });
    label.textContent = '0' + (i + 1) + ' / 0' + cards.length + '　' + cards[i].dataset.name;
    prev.disabled = i === 0; next.disabled = i === cards.length - 1;
  }
  function paneScrolls() { return pane.scrollHeight > pane.clientHeight + 4 && getComputedStyle(pane).overflowY !== 'visible'; }
  function go(i, scroll) {
    i = Math.max(0, Math.min(cards.length - 1, i));
    show(i);
    if (mobile()) {
      // 手機：箭頭、圓點、方向鍵把卡片列捲到該張；長文是否跟著換段由 layout() 決定，不捲動頁面
      if (scroll) {
        deckLock = Date.now() + 700;
        deck.scrollTo({ left: deckLeft(i), behavior: reduce ? 'auto' : 'smooth' });
      }
      return;
    }
    if (scroll && secs[i] && paneScrolls()) {
      lock = Date.now() + 1000;
      pane.scrollTo({ top: Math.max(0, secs[i].offsetTop - 32), behavior: reduce ? 'auto' : 'smooth' });
    }
  }
  function spy() {
    // 長文捲動帶動卡片：只用於桌面。手機「隨卡片」時長文只有一段，「全文」時依使用者決定互不連動
    if (mobile() || Date.now() < lock || !secs.length) return;
    var inPane = paneScrolls();
    var edge = inPane ? pane.getBoundingClientRect().top + pane.clientHeight * 0.35 : window.innerHeight * 0.35;
    var n = -1;
    secs.forEach(function (s, k) { if (s.getBoundingClientRect().top <= edge) n = k; });
    if (inPane && pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 8) n = secs.length - 1;
    // 桌面長文開頭（標題、導語）對應封面卡；手機版卡片在長文上方，長文尚未捲到第一節時不換卡，
    // 以免捲動頁面時把讀者選好的卡片拉回第 1 張
    if (n < 0 && inPane) n = 0;
    if (n >= 0) show(n);
  }
  prev.addEventListener('click', function () { go(cur - 1, true); });
  next.addEventListener('click', function () { go(cur + 1, true); });
  stage.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1, true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1, true); }
  });
  pane.addEventListener('scroll', spy, { passive: true });
  // 手機：手指滑動卡片列，停下時以最接近的一張為目前卡片
  deck.addEventListener('scroll', function () {
    if (!mobile() || Date.now() < deckLock || cards.length < 2) return;
    show(Math.max(0, Math.min(cards.length - 1, Math.round(deck.scrollLeft / deckLeft(1)))));
  }, { passive: true });
  function setFull(on) {
    full = on;
    mCard.setAttribute('aria-pressed', on ? 'false' : 'true');
    mFull.setAttribute('aria-pressed', on ? 'true' : 'false');
    layout();
    // 從全文切回隨卡片時長文變短，若已捲過長文開頭，回到長文開頭
    var top = art.getBoundingClientRect().top + window.scrollY;
    if (!on && window.scrollY > top) window.scrollTo({ top: top, behavior: 'auto' });
  }
  mCard.addEventListener('click', function () { setFull(false); });
  mFull.addEventListener('click', function () { setFull(true); });
  function onMedia() {
    layout();
    if (mobile()) deck.scrollLeft = deckLeft(cur);
  }
  if (mq.addEventListener) mq.addEventListener('change', onMedia); else mq.addListener(onMedia);
  layout();
  go(0, false);
  window.addEventListener('load', function () {
    if (!window.katex) return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-tex]'), function (el) {
      try {
        window.katex.render(el.getAttribute('data-tex'), el, { displayMode: el.classList.contains('m-disp'), throwOnError: false, strict: 'ignore' });
      } catch (err) { el.textContent = el.getAttribute('data-tex'); }
    });
  });
})();
</script>
</body>
</html>
